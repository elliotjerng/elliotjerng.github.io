- title: Modeling Synaptic Sign Switching
  date: Nov 2024 - Feb 2025
  institution: Sabatini Lab
  institution_url: https://sabatini.hms.harvard.edu/
  description: By shifting data targets throughout ANN learning, we developed a task to evaluate synaptic sign switching. Comparing sign-fixed ANNs following Dale's Law to co-releasing ANNs showed advantages of the co-release mechanism in sparsely active networks.
